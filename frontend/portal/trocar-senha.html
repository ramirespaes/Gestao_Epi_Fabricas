<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Gestão de EPI</title>
  <style>
    /* Mesma identidade visual do login do Portal (portal/index.html); no modo escuro só as variáveis mudam. */
    :root { color-scheme: light dark; --ink: #153333; --muted: #617471; --accent: #1f7563; --accent-forte: #153333; --surface: #ffffff; --bg: #f7f8f6; --line: #e3e9e5; --campo: #ffffff; --hover: #8ab5a7; --foco: #e1efe9; --erro: #b3261e; --erro-fundo: #fdecea; --info-fundo: #eaf5ef; --ok: #1a7a35; --sombra: #173d3720; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e8f0ed; --muted: #a2b3af; --accent: #26806b; --accent-forte: #1f6b59; --surface: #1f2826; --bg: #151b1a; --line: #33403d; --campo: #182120; --hover: #4f8f80; --foco: rgba(108, 201, 176, 0.25); --erro: #ff8a80; --erro-fundo: rgba(255, 69, 58, 0.15); --info-fundo: rgba(108, 201, 176, 0.12); --ok: #30d158; --sombra: #00000055; }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .centro { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    /* A mesma página e paleta do Portal, com acabamento de vidro fosco.
       Painel de 36px = campos de 12px + recuo de 24px, sem alterar o fluxo. */
    .cartao { width: 100%; max-width: 480px; min-width: 0; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 36px; box-shadow: 0 20px 60px var(--sombra); }
    .marca { text-align: left; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .marca-nome { display: block; font-size: 20px; font-weight: 740; letter-spacing: -.04em; color: var(--ink); }
    .marca-nome span { font-weight: 480; letter-spacing: -.035em; color: var(--muted); }
    .marca-sub { display: block; margin-top: 6px; font-size: 11px; font-weight: 600; line-height: 1.6; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0 0 20px; font-size: 28px; font-weight: 740; line-height: 1.2; letter-spacing: -.03em; color: var(--ink); }
    .ajuda { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: var(--muted); }
    .mensagem { min-height: 1.2rem; margin-bottom: 16px; font-size: 13px; line-height: 1.65; border-radius: 12px; overflow-wrap: anywhere; }
    .mensagem.erro { padding: 12px 14px; color: var(--erro); background: var(--erro-fundo); border: 1px solid var(--erro); }
    .mensagem.info { padding: 12px 14px; color: var(--ink); background: var(--info-fundo); border: 1px solid var(--line); }
    .mensagem:empty { min-height: 0; padding: 0; margin-bottom: 0; background: none; }
    .sucesso { margin: 0 0 14px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--info-fundo); font-size: 14px; line-height: 1.7; }
    .sucesso strong { color: var(--ok); }
    label { display: block; margin: 0 0 8px; font-size: 13px; font-weight: 600; line-height: 1.5; color: var(--ink); }
    input { width: 100%; min-width: 0; height: 48px; padding: 0 14px; margin-bottom: 20px; font: inherit; font-size: 16px; color: var(--ink); background: var(--campo); border: 1px solid var(--line); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
    input:hover { border-color: var(--hover); }
    input:focus-visible { border-color: var(--hover); box-shadow: 0 0 0 3px var(--foco); }
    .botao { display: block; width: 100%; min-height: 48px; padding: 12px 16px; margin-top: 4px; font: inherit; font-size: 15px; font-weight: 600; line-height: 1.5; color: #ffffff; background: var(--accent); border: 1px solid transparent; border-radius: 12px; cursor: pointer; transition: background-color .15s, box-shadow .15s; }
    .botao:hover:not(:disabled), .botao:focus-visible { background: var(--accent-forte); }
    .botao:disabled { opacity: .6; cursor: not-allowed; }
    .voltar { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 20px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; font-weight: 600; line-height: 1.5; color: var(--ink); text-decoration: none; }
    .voltar:hover, .voltar:focus-visible { color: var(--accent); text-decoration: underline; }
    :is(input, .botao, .voltar):focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 500px) { .centro { padding: 16px; } .cartao { padding: 20px; border-radius: 32px; } h1 { font-size: 25px; } }
    @media (forced-colors: none) and (prefers-contrast: no-preference) {
      @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) and (color: color-mix(in srgb, white, transparent)) {
        body { background: radial-gradient(ellipse at 85% 12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%), radial-gradient(ellipse at 10% 80%, color-mix(in srgb, var(--hover) 20%, transparent), transparent 55%), var(--bg); background-attachment: fixed; }
        .cartao { background: linear-gradient(135deg, rgba(255,255,255,.3), transparent 58%), color-mix(in srgb, var(--surface) 68%, transparent); border-color: color-mix(in srgb, var(--line) 45%, rgba(255,255,255,.6)); backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%); box-shadow: 0 1px 0 rgba(255,255,255,.85) inset, 0 20px 60px var(--sombra); }
        input { background: color-mix(in srgb, var(--ink) 4%, color-mix(in srgb, var(--campo) 76%, transparent)); }
        @media (prefers-color-scheme: dark) {
          .cartao { background: linear-gradient(135deg, rgba(255,255,255,.1), transparent 58%), color-mix(in srgb, var(--surface) 76%, transparent); border-color: color-mix(in srgb, var(--line) 60%, rgba(255,255,255,.2)); box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 20px 60px var(--sombra); }
        }
      }
    }
    @media (prefers-reduced-motion: reduce) { input, .botao, .voltar { transition: none; } }
    @media (prefers-contrast: more) { .cartao, input, .voltar { border: 2px solid var(--ink); box-shadow: none; } }
    @media (forced-colors: active) {
      body, .cartao, input, .voltar, .mensagem, .sucesso { background: Canvas; color: CanvasText; border-color: CanvasText; box-shadow: none; }
      .botao { background: ButtonFace; color: ButtonText; border-color: ButtonText; }
      .sucesso strong { color: CanvasText; }
      :is(input, .botao, .voltar):focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
<!--
  Troca de senha com a sessão global em uso (Bloco 11F). A página só mostra o
  formulário depois de o servidor confirmar a sessão. A confirmação da senha
  nova é só da tela: quem decide é o servidor. Depois da troca esta sessão
  continua valendo e as outras são encerradas pelo servidor.
-->
<body>
  <div class="centro">
    <div class="cartao">
      <div class="marca">
        <strong class="marca-nome">SafeWork <span>Engenharia</span></strong>
        <span class="marca-sub">Portal do Cliente · Gestão de EPIs</span>
      </div>
      <h1>Trocar senha</h1>
      <p id="carregando" class="ajuda">Verificando a sua sessão…</p>
      <div id="mensagem" class="mensagem" role="alert" aria-live="polite"></div>

      <form id="form-troca" novalidate hidden>
        <label for="senha-atual">Senha atual</label>
        <input type="password" id="senha-atual" name="senha-atual" autocomplete="current-password" required>
        <label for="senha-nova">Nova senha</label>
        <input type="password" id="senha-nova" name="senha-nova" autocomplete="new-password" required>
        <label for="senha-confirmacao">Confirme a nova senha</label>
        <input type="password" id="senha-confirmacao" name="senha-confirmacao" autocomplete="new-password" required>
        <button type="submit" id="botao-trocar" class="botao">Trocar senha</button>
      </form>

      <div id="sucesso" role="status" hidden>
        <p class="sucesso"><strong>Senha alterada.</strong> Os demais acessos à sua conta foram encerrados. Este continua ativo: você não precisa entrar de novo.</p>
      </div>

      <a class="voltar" href="inicio.html">Voltar ao início</a>
    </div>
  </div>

  <script src="../js/api-http.js"></script>
  <script src="../js/portal-cliente.js"></script>
  <script src="../js/senha-ciclo.js"></script>
  <script src="config.js"></script>
  <script src="trocar-senha.js"></script>
</body>
</html>
