<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Gestão de EPI</title>
  <style>
    /* Paleta original SafeWork. O acabamento do Portal é compartilhado em acesso-visual.css. */
    :root { color-scheme: light dark; --ink: #153333; --muted: #617471; --accent: #1f7563; --accent-forte: #153333; --surface: #ffffff; --bg: #f7f8f6; --line: #e3e9e5; --campo: #ffffff; --hover: #8ab5a7; --foco: #e1efe9; --logo-fundo: #153333; --erro: #b3261e; --erro-fundo: #fdecea; --info-fundo: #eaf5ef; --sombra: #173d3720; }
    /* E10: no sistema em modo escuro, só as variáveis mudam; as regras são as mesmas. */
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e8f0ed; --muted: #a2b3af; --accent: #26806b; --accent-forte: #1f6b59; --surface: #1f2826; --bg: #151b1a; --line: #33403d; --campo: #182120; --hover: #4f8f80; --foco: rgba(108, 201, 176, 0.25); --logo-fundo: #26806b; --erro: #ff8a80; --erro-fundo: rgba(255, 69, 58, 0.15); --info-fundo: rgba(108, 201, 176, 0.12); --sombra: #00000055; }
    }

  </style>
  <link rel="stylesheet" href="acesso-visual.css">
</head>
<body>
  <div class="centro">
    <form id="form-login" class="cartao" novalidate>
      <div class="marca">
        <a id="link-logo-site" class="logo-site" href="#" aria-label="SafeWork Engenharia — voltar ao site" hidden><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 17.3 12.1 24 27 8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <strong class="marca-nome">SafeWork <span>Engenharia</span></strong>
        <span class="marca-sub">Portal do Cliente · Gestão de EPIs</span>
      </div>
      <h1>Entrar</h1>
      <div id="mensagem" class="mensagem" role="alert" aria-live="polite"></div>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      <div id="verificacao" class="verificacao"></div>
      <button type="submit" id="botao-entrar" class="botao" disabled>Entrar</button>
      <a id="link-esqueci-senha" class="voltar-site esqueci-senha" href="recuperar-senha.html">Esqueci minha senha</a>
      <a id="link-voltar-site" class="voltar-site" href="#" hidden>Voltar ao site</a>
    </form>
  </div>

  <!-- Script oficial do Turnstile, carregado antes do login.js, que renderiza o widget. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
  <script src="../js/api-http.js"></script>
  <script src="../js/portal-cliente.js"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
  <script>
    // Logo e "Voltar ao site": levam à página institucional da SafeWork
    // Engenharia. Ambiente local (localhost, 127.0.0.1, [::1]): a institucional
    // está na origem 5500, com o mesmo caminho até frontend/ que esta página
    // (raiz do repositório ou raiz em frontend/). Produção: somente
    // SITE_INSTITUCIONAL_PRODUCAO, a preencher com o domínio institucional
    // definitivo na implantação; enquanto vazio, os links ficam ocultos — um
    // visitante de produção nunca é levado a localhost. É um link comum, sem
    // depender do histórico do navegador.
    (function () {
      'use strict';
      const SITE_INSTITUCIONAL_PRODUCAO = '';
      const HOSTS_LOCAIS = ['localhost', '127.0.0.1', '[::1]'];
      let destino = SITE_INSTITUCIONAL_PRODUCAO;
      if (HOSTS_LOCAIS.indexOf(location.hostname) !== -1) {
        const base = location.pathname.replace(/\/portal\/[^/]*$/, '');
        destino = 'http://localhost:5500' + base + '/institucional/safework_engenharia_pagina_inicial.html';
      }
      if (!destino) return;
      ['link-logo-site', 'link-voltar-site'].forEach(function (id) {
        const link = document.getElementById(id);
        if (!link) return;
        link.href = destino;
        link.hidden = false;
      });
    })();
  </script>
</body>
</html>
