<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=gestao-usuarios.html">
  <title>Administração de Usuários — tela substituída</title>
  <script src="../js/tema.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px; line-height: 1.5; }
    main { max-width: 520px; margin: 0 auto; }
  </style>
</head>
<!--
  TELA APOSENTADA (fechamento da Gestão de Usuários). Não carrega módulo, não chama API e não administra nada: listar,
  alterar, duplicar, alterar senha, desabilitar e reativar usuários é feito só em Gestão de Usuários
  (gestao-usuarios.html).
-->
<body>
  <main>
    <h1>Esta tela foi substituída</h1>
    <p>A administração de usuários agora é feita em <a href="gestao-usuarios.html" id="destino">Gestão de Usuários</a>. Você será levado para lá.</p>
  </main>
  <script>
    (function () {
      var alvo = document.getElementById('destino');
      alvo.setAttribute('href', 'gestao-usuarios.html' + window.location.search);
      window.location.replace(alvo.getAttribute('href'));
    })();
  </script>
</body>
</html>
