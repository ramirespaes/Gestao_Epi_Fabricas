<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Privado — SafeWork</title>
  <style>
    /* Identidade visual SafeWork Engenharia — mesmas variáveis, fonte e medidas da tela de login (index.html) */
    :root { color-scheme: light; --ink: #153333; --muted: #617471; --accent: #1f7563; --accent-forte: #153333; --surface: #ffffff; --bg: #f7f8f6; --line: #e3e9e5; --campo: #ffffff; --hover: #8ab5a7; --foco: #e1efe9; --logo-fundo: #153333; --erro: #b3261e; --erro-fundo: #fdecea; --ok: #1f7563; --ok-fundo: #eaf5ef; --aviso: #8a5a00; --aviso-fundo: #fff4dd; --info-fundo: #eaf5ef; --sombra: #173d3720; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px clamp(16px, 4vw, 40px); background: var(--surface); border-bottom: 1px solid var(--line); }
    .marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .marca-logo { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--logo-fundo); color: #ffffff; }
    .marca-logo svg { width: 24px; height: 24px; }
    .marca-nome { display: block; font-size: 16px; font-weight: 740; letter-spacing: -.04em; color: var(--ink); }
    .marca-nome span { font-weight: 480; letter-spacing: -.03em; color: var(--muted); }
    .marca-sub { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    header h1 { margin: 0; font-size: 16px; font-weight: 740; letter-spacing: -.04em; color: var(--ink); }
    nav a { color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 16px; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; color: var(--accent-forte); }
    button { font: inherit; font-size: 14px; font-weight: 600; color: #ffffff; background: var(--accent); border: 1px solid var(--accent); border-radius: 11px; padding: 9px 16px; cursor: pointer; transition: background-color .15s, box-shadow .15s; }
    button:hover, button:focus-visible { background: var(--accent-forte); border-color: var(--accent-forte); outline: none; box-shadow: 0 0 0 3px var(--foco); }
    button.secundario { color: var(--accent); background: var(--surface); border-color: var(--line); }
    button.secundario:hover, button.secundario:focus-visible { color: var(--accent-forte); background: var(--foco); border-color: var(--hover); }
    button:disabled { opacity: .6; cursor: default; box-shadow: none; }
    #carregando, #erro { padding: 24px clamp(16px, 4vw, 40px); color: var(--muted); }
    #erro { color: var(--erro); display: none; }
    main { padding: 24px clamp(16px, 4vw, 40px); max-width: 760px; }
    .cartao { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; padding: 24px; box-shadow: 0 22px 55px var(--sombra); }
    .cartao p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .cartao strong { color: var(--ink); }
    .modulo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 13px; color: var(--ink); text-decoration: none; font-weight: 600; transition: border-color .15s, background-color .15s; }
    .modulo:hover, .modulo:focus-visible { background: var(--foco); border-color: var(--hover); outline: none; }
    .modulo .icone { display: inline-grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 11px; background: var(--info-fundo); color: var(--accent); }
    .modulo .icone svg { width: 20px; height: 20px; }
    .modulo small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="marca">
      <span class="marca-logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M5 17.3 12.1 24 27 8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div>
        <h1 class="marca-nome">SafeWork <span>Engenharia</span></h1>
        <span class="marca-sub">Painel Privado · Administração SafeWork</span>
      </div>
    </div>
    <button id="sair" type="button" class="secundario">Sair</button>
  </header>
  <main>
    <p id="carregando">Carregando...</p>
    <p id="erro"></p>
    <div id="conteudo" class="cartao" style="display:none;">
      <p>Administrador autenticado: <strong id="email-administrador"></strong></p>
      <nav>
        <a class="modulo" href="empresas.html"><span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 21V5l8-3 8 3v16M2 21h20M9 21v-6h6v6M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Empresas contratantes<small>cadastro, situação e convite do primeiro MASTER</small></span></a>
      </nav>
    </div>
  </main>

  <script src="../js/api-http.js?v=20260925"></script>
  <script src="config.js?v=20260925"></script>
  <script src="painel.js?v=20260925"></script>
</body>
</html>
