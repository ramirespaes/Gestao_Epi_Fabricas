<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Privado — SafeWork</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #10151c; color: #e6e9ee; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    form { background: #1a212b; padding: 2rem; border-radius: 8px; width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    h1 { font-size: 1.1rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #33404f; background: #0d1117; color: #e6e9ee; box-sizing: border-box; }
    button { width: 100%; padding: 0.6rem; background: #3861fb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    button:disabled { opacity: 0.6; cursor: default; }
    #mensagem { min-height: 1.2rem; font-size: 0.85rem; color: #ff6b6b; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <form id="form-login" novalidate>
    <h1>Painel Privado — SafeWork</h1>
    <div id="mensagem" role="alert" aria-live="polite"></div>
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    <button type="submit" id="botao-entrar">Entrar</button>
  </form>

  <script src="../js/api-http.js"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
