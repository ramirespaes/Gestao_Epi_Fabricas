<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de EPI</title>
  <style>
    /* Identidade visual SafeWork Engenharia — mesmas variáveis, fonte e medidas do Painel Privado (empresas.html) */
    :root { color-scheme: light; --ink: #153333; --muted: #617471; --accent: #1f7563; --accent-forte: #153333; --surface: #ffffff; --bg: #f7f8f6; --line: #e3e9e5; --campo: #ffffff; --hover: #8ab5a7; --foco: #e1efe9; --logo-fundo: #153333; --erro: #b3261e; --erro-fundo: #fdecea; --ok: #1f7563; --ok-fundo: #eaf5ef; --aviso: #8a5a00; --aviso-fundo: #fff4dd; --info-fundo: #eaf5ef; --sombra: #173d3720; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px clamp(16px, 4vw, 40px); background: var(--surface); border-bottom: 1px solid var(--line); }
    .marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .marca-logo { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--logo-fundo); color: #ffffff; }
    .marca-logo svg { width: 24px; height: 24px; }
    .marca-nome { display: block; font-size: 16px; font-weight: 740; letter-spacing: -.04em; color: var(--ink); }
    .marca-nome span { font-weight: 480; letter-spacing: -.03em; color: var(--muted); }
    .marca-sub { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    header h1 { margin: 0; font-size: 16px; font-weight: 740; letter-spacing: -.04em; color: var(--ink); }
    nav a { color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 16px; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; color: var(--accent-forte); }
    button { font: inherit; font-size: 14px; font-weight: 600; color: #ffffff; background: var(--accent); border: 1px solid var(--accent); border-radius: 11px; padding: 9px 16px; cursor: pointer; transition: background-color .15s, box-shadow .15s; }
    button:hover, button:focus-visible { background: var(--accent-forte); border-color: var(--accent-forte); outline: none; box-shadow: 0 0 0 3px var(--foco); }
    button.secundario { color: var(--accent); background: var(--surface); border-color: var(--line); }
    button.secundario:hover, button.secundario:focus-visible { color: var(--accent-forte); background: var(--foco); border-color: var(--hover); }
    button:disabled { opacity: .6; cursor: default; box-shadow: none; }
    #carregando, #erro { padding: 24px clamp(16px, 4vw, 40px); color: var(--muted); }
    #erro { color: var(--erro); display: none; }
    main { padding: 24px clamp(16px, 4vw, 40px); }
    .colunas { display: grid; grid-template-columns: 1fr 1.3fr; gap: 24px; align-items: start; }
    section { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; padding: 20px; box-shadow: 0 22px 55px var(--sombra); }
    h2 { margin: 0 0 12px; font-size: 16px; font-weight: 740; letter-spacing: -.03em; color: var(--ink); }
    h3 { margin: 16px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .barra { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .barra input { flex: 1; min-width: 140px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
    td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); color: var(--ink); overflow-wrap: anywhere; }
    td small { color: var(--muted); }
    tr.selecionavel { cursor: pointer; }
    tr.selecionavel:hover, tr.selecionada { background: var(--foco); }
    label { display: block; margin: 10px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    input, select, textarea { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--campo); border: 1px solid var(--line); border-radius: 11px; outline: none; transition: border-color .15s, box-shadow .15s; }
    input, select { height: 40px; padding: 0 12px; }
    textarea { min-height: 110px; padding: 10px 12px; resize: vertical; }
    input:hover, select:hover, textarea:hover { border-color: var(--hover); }
    input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--hover); box-shadow: 0 0 0 3px var(--foco); }
    .mensagem { min-height: 1.2rem; margin: 8px 0; font-size: 13px; border-radius: 11px; }
    .mensagem.erro, .mensagem.ok, .mensagem.aviso { padding: 9px 12px; }
    .mensagem:empty { padding: 0; background: none; }
    .erro { color: var(--erro); background: var(--erro-fundo); }
    .ok { color: var(--ok); background: var(--ok-fundo); }
    .aviso { color: var(--aviso); background: var(--aviso-fundo); }
    .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
    .texto { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; }
    .resposta { border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg); }
    .resposta small { display: block; color: var(--muted); margin-bottom: 4px; }
    /* Conversa: mensagens do solicitante (esquerda, fundo neutro) e do suporte SafeWork (direita, fundo da marca). */
    .resposta.solicitante { margin-right: 12%; }
    .resposta.suporte { margin-left: 12%; background: var(--info-fundo); border-color: var(--hover); }
    #det-conversa { max-height: 44vh; overflow: auto; padding-right: 4px; }
    .novas { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--aviso-fundo); color: var(--aviso); }
    tr.nao-lida td:first-child strong { color: var(--accent-forte); }
    .filtro-caixa { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .filtro-caixa input { width: auto; height: auto; }
    .selo { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--info-fundo); color: var(--accent); }
    .selo.ENCERRADO { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .selo.ABERTO { background: var(--aviso-fundo); color: var(--aviso); }
    #detalhe { display: none; }
    ul.historico { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
    @media (max-width: 900px) { .colunas { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { header { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header>
    <div class="marca">
      <span class="marca-logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M5 17.3 12.1 24 27 8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div>
        <h1 class="marca-nome">SafeWork <span>Engenharia</span></h1>
        <span class="marca-sub">Painel Privado · Administração SafeWork</span>
        <nav style="margin-top:6px;"><a href="painel.html">Início</a><a href="empresas.html">Empresas</a><a href="suporte.html">Suporte</a></nav>
      </div>
    </div>
    <button id="sair" type="button" class="secundario">Sair</button>
  </header>

  <p id="carregando">Carregando...</p>
  <p id="erro" role="alert"></p>
  <main id="conteudo" style="display:none;">
   <div class="colunas">
    <section>
      <h2>Chamados de suporte</h2>
      <div class="barra">
        <select id="filtro-situacao" aria-label="Situação" style="flex:0 0 170px;">
          <option value="">Todas as situações</option>
          <option value="ABERTO">Aberto</option>
          <option value="EM_ATENDIMENTO">Em atendimento</option>
          <option value="RESPONDIDO">Respondido</option>
          <option value="ENCERRADO">Encerrado</option>
        </select>
        <input id="busca" placeholder="Protocolo, assunto ou empresa" aria-label="Busca">
        <button id="btn-buscar" type="button" class="secundario">Buscar</button>
        <label class="filtro-caixa"><input type="checkbox" id="filtro-nao-lidas"> Só com mensagens novas</label>
      </div>
      <p id="msg-lista" class="mensagem" role="status"></p>
      <table>
        <thead><tr><th>Protocolo</th><th>Empresa</th><th>Situação</th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
      <div class="acoes">
        <button id="btn-anterior" type="button" class="secundario">Anterior</button>
        <button id="btn-proxima" type="button" class="secundario">Próxima</button>
      </div>
    </section>

    <section>
      <h2 id="titulo-detalhe">Atendimento</h2>
      <p id="vazio" class="mensagem">Selecione um chamado para ver os detalhes.</p>
      <p id="msg-detalhe" class="mensagem" role="status"></p>
      <div id="detalhe">
        <p><span id="det-situacao" class="selo"></span></p>
        <p id="det-empresa" class="texto"></p>
        <p id="det-solicitante" class="texto"></p>
        <p id="det-assunto" class="texto" style="font-weight:600;"></p>
        <p id="det-descricao" class="texto"></p>

        <h3>Conversa</h3>
        <div id="det-conversa" role="log" aria-live="polite"></div>

        <h3>Responder</h3>
        <form id="form-resposta" novalidate>
          <label for="resposta-texto">Resposta ao solicitante</label>
          <textarea id="resposta-texto" maxlength="4000"></textarea>
          <div class="acoes"><button id="btn-responder" type="submit">Enviar resposta</button></div>
        </form>

        <hr>
        <h3>Situação do atendimento</h3>
        <div class="barra">
          <select id="nova-situacao" aria-label="Nova situação">
            <option value="ABERTO">Aberto</option>
            <option value="EM_ATENDIMENTO">Em atendimento</option>
            <option value="RESPONDIDO">Respondido</option>
            <option value="ENCERRADO">Encerrado</option>
          </select>
          <button id="btn-situacao" type="button" class="secundario">Alterar situação</button>
          <button id="btn-encerrar" type="button" class="secundario">Encerrar atendimento</button>
          <button id="btn-reabrir" type="button" style="display:none;">Reabrir atendimento</button>
        </div>
        <div id="confirmar-reabrir" class="mensagem aviso" role="alertdialog" aria-label="Confirmar reabertura" style="display:none;">
          <span id="texto-reabrir"></span>
          <div class="acoes">
            <button id="btn-confirmar-reabrir" type="button">Confirmar reabertura</button>
            <button id="btn-cancelar-reabrir" type="button" class="secundario">Cancelar</button>
          </div>
        </div>
        <div id="confirmar-encerrar" class="mensagem aviso" role="alertdialog" aria-label="Confirmar encerramento" style="display:none;">
          <span id="texto-encerrar"></span>
          <div class="acoes">
            <button id="btn-confirmar-encerrar" type="button">Confirmar encerramento</button>
            <button id="btn-cancelar-encerrar" type="button" class="secundario">Cancelar</button>
          </div>
        </div>
        <h3>Histórico</h3>
        <ul id="det-historico" class="historico"></ul>
      </div>
    </section>
   </div>
  </main>

  <script src="../js/api-http.js?v=20260925"></script>
  <script src="config.js?v=20260925"></script>
  <script src="sair.js?v=20260929"></script>
  <script src="suporte.js?v=20261026"></script>
</body>
</html>
