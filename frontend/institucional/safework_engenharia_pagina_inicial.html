<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f6">
  <title>Gestão de EPI</title>
  <style>
    /* Paleta original preservada; acabamento exclusivo desta página. */
    :root { color-scheme:light; --ink:#153333; --muted:#617471; --accent:#1f7563; --surface:#ffffff; --bg:#f7f8f6; --line:#e3e9e5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:flex; flex-direction:column; background:radial-gradient(ellipse at 85% 8%,#e1efe9,transparent 52%),radial-gradient(ellipse at 8% 85%,#eaf5ef,transparent 48%),var(--bg); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; color:var(--ink); }
    header { width:min(1320px,calc(100% - 48px)); min-height:80px; margin:24px auto 0; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 16px; position:relative; z-index:5; border:1px solid var(--line); border-radius:32px; background:var(--surface); box-shadow:0 8px 30px #173d3708; }
    .brand { display:flex; align-items:center; gap:13px; min-width:0; text-decoration:none; color:inherit; border-radius:16px; }
    .mark { display:grid; place-items:center; flex:none; width:48px; height:48px; border-radius:16px; background:linear-gradient(145deg,var(--accent),var(--ink)); color:white; box-shadow:0 1px 0 #ffffff30 inset,0 5px 12px #173d3718; }
    .mark svg { width:27px; height:27px; }
    .brand-name { font-size:18px; font-weight:740; line-height:1.3; letter-spacing:-.04em; }
    .brand-name span { font-weight:480; color:var(--muted); letter-spacing:-.035em; }
    .nav { position:relative; flex:none; }
    .menu-button { width:48px; height:48px; display:grid; place-content:center; gap:5px; border:1px solid var(--line); border-radius:50%; background:var(--surface); cursor:pointer; box-shadow:0 1px 0 #ffffffb3 inset,0 3px 10px #173d370a; transition:background-color .18s,border-color .18s,box-shadow .18s; }
    .menu-button:hover { background:#eaf5ef; border-color:#8ab5a7; box-shadow:0 4px 14px #173d3714; }
    .menu-button span { display:block; width:19px; height:2px; background:var(--ink); border-radius:5px; transition:transform .2s,opacity .2s; }
    .menu-button[aria-expanded="true"] span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .menu-button[aria-expanded="true"] span:nth-child(2) { opacity:0; }
    .menu-button[aria-expanded="true"] span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
    /* Menu de 32px = itens de 24px + recuo de 8px. */
    .menu-panel { position:absolute; right:0; top:64px; width:min(320px,calc(100vw - 64px)); padding:8px; border:1px solid var(--line); border-radius:32px; background:var(--surface); box-shadow:0 16px 48px #173d3720; }
    .menu-panel[hidden] { display:none; }
    .menu-title { margin:12px 16px 10px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.13em; font-weight:700; }
    .menu-link { display:flex; align-items:center; gap:12px; width:100%; min-height:72px; padding:12px; border:1px solid transparent; border-radius:24px; text-decoration:none; text-align:left; color:var(--ink); background:transparent; cursor:pointer; font:inherit; transition:background-color .18s,border-color .18s; }
    .menu-link + .menu-link { margin-top:4px; }
    .menu-link:hover,.menu-link:focus-visible { background:#eaf5ef; border-color:var(--line); }
    .menu-icon { display:grid; place-items:center; flex:none; width:42px; height:42px; border-radius:12px; background:#eaf5ef; color:var(--accent); border:1px solid var(--line); }
    .menu-icon svg { width:20px; height:20px; }
    .menu-copy { min-width:0; overflow-wrap:anywhere; }
    .menu-copy strong { display:block; font-size:14px; line-height:1.5; font-weight:680; }
    .menu-copy small { display:block; margin-top:3px; font-size:12px; line-height:1.5; color:var(--muted); }
    main { flex:1; display:grid; place-items:center; padding:clamp(32px,6vh,72px) 24px 40px; text-align:center; }
    /* Moldura interna acompanha o raio externo menos o recuo visual. */
    .hero { --hero-radius:48px; --hero-inset:12px; position:relative; width:min(960px,100%); min-width:0; padding:clamp(40px,6vw,72px) 32px; border:1px solid var(--line); border-radius:var(--hero-radius); background:var(--surface); box-shadow:0 24px 70px #173d370b; }
    .hero::before { content:""; position:absolute; inset:var(--hero-inset); border:1px solid #e3e9e580; border-radius:calc(var(--hero-radius) - var(--hero-inset)); pointer-events:none; }
    .eyebrow { display:inline-flex; align-items:center; justify-content:center; gap:9px; max-width:100%; color:var(--accent); font-size:11px; line-height:1.8; font-weight:760; letter-spacing:.16em; text-transform:uppercase; }
    .eyebrow:before { content:""; flex:none; width:8px; height:8px; background:#40a487; border-radius:50%; box-shadow:0 0 0 5px #40a48712; }
    h1 { font-size:clamp(44px,8vw,104px); letter-spacing:-.065em; font-weight:740; line-height:1.02; margin:28px 0 24px; }
    h1 span { color:var(--accent); }
    .subtitle { margin:0; color:var(--muted); font-size:clamp(19px,2.8vw,25px); line-height:1.5; letter-spacing:-.025em; font-weight:400; }
    .divider { width:56px; height:3px; background:#83c1ab; margin:32px auto 0; border-radius:10px; }
    footer { display:flex; justify-content:center; align-items:center; gap:4px; min-height:66px; padding:14px 24px 24px; color:var(--muted); font-size:12px; line-height:1.6; text-align:center; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:white; padding:16px 20px; border:1px solid #ffffff26; border-radius:20px; line-height:1.6; text-align:center; width:max-content; max-width:calc(100vw - 32px); box-shadow:0 15px 40px #173d3730; z-index:10; font-size:13px; }
    .toast[hidden] { display:none; }
    a:focus-visible,button:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    /* Vidro moderado; sem suporte, as superfícies sólidas acima permanecem. */
    @media screen and (forced-colors:none) and (prefers-contrast:no-preference) {
      @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) and (color:color-mix(in srgb,white,transparent)) {
        header,.hero,.menu-panel { background:linear-gradient(135deg,#ffffffb3,transparent 60%),color-mix(in srgb,var(--surface) 52%,transparent); border-color:color-mix(in srgb,var(--line) 35%,#ffffffcc); backdrop-filter:blur(26px) saturate(150%); -webkit-backdrop-filter:blur(26px) saturate(150%); }
        header { box-shadow:0 1px 0 #ffffffe6 inset,0 8px 30px #173d3708; }
        .hero { background:radial-gradient(ellipse at 90% 15%,#83c1ab14,transparent 60%),linear-gradient(135deg,#ffffffb3,transparent 60%),color-mix(in srgb,var(--surface) 48%,transparent); box-shadow:0 1px 0 #ffffffe6 inset,0 -1px 0 #ffffff4d inset,0 24px 70px #173d370b; }
        .hero::before { border-color:#ffffffb3; }
        .menu-panel { background:linear-gradient(135deg,#ffffff99,transparent 60%),color-mix(in srgb,var(--surface) 78%,transparent); box-shadow:0 1px 0 #ffffffe6 inset,0 16px 48px #173d3720; }
        .menu-button { background:color-mix(in srgb,var(--surface) 64%,transparent); }
      }
    }
    @media(max-width:600px) {
      header { width:calc(100% - 32px); min-height:70px; margin-top:16px; padding:12px; border-radius:28px; gap:10px; }
      .brand { gap:10px; }
      .brand-name { font-size:15px; }
      .mark { width:42px; height:42px; border-radius:14px; }
      .mark svg { width:24px; height:24px; }
      .menu-button { width:44px; height:44px; }
      .menu-panel { top:58px; width:min(320px,calc(100vw - 56px)); }
      main { padding:28px 16px; }
      .hero { --hero-radius:32px; --hero-inset:8px; padding:40px 20px; }
      .eyebrow { font-size:10px; letter-spacing:.1em; }
      h1 { margin:24px 0 20px; }
      .divider { margin-top:24px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
    @media(prefers-contrast:more) { body { background:var(--bg); } header,.hero,.menu-panel,.menu-button,.menu-link,.menu-icon { border:2px solid var(--ink); box-shadow:none; } .hero::before { display:none; } }
    @media(forced-colors:active) {
      body,header,.hero,.menu-panel,.menu-button,.menu-link,.menu-icon,.toast { background:Canvas; color:CanvasText; border-color:CanvasText; box-shadow:none; }
      .mark { background:Highlight; color:HighlightText; }
      h1 span,.eyebrow,.brand-name span,.menu-copy small,.menu-title,.subtitle,footer { color:CanvasText; }
      .menu-button span,.eyebrow:before,.divider { background:CanvasText; box-shadow:none; }
      .hero::before { display:none; }
      a:focus-visible,button:focus-visible { outline-color:Highlight; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./safework_engenharia_pagina_inicial.html" aria-label="SafeWork Engenharia, página inicial">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M5 17.3 12.1 24 27 8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">SafeWork <span>Engenharia</span></span>
    </a>
    <nav class="nav" aria-label="Acessos">
      <button type="button" class="menu-button" id="menuButton" aria-expanded="false" aria-controls="menuPanel" aria-label="Abrir menu de acessos">
        <span></span><span></span><span></span>
      </button>
      <div id="menuPanel" class="menu-panel" hidden>
        <p class="menu-title">Acessar</p>
        <a id="linkEmpresas" class="menu-link" href="#">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 21V5l8-3 8 3v16M2 21h20M9 21v-6h6v6M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="menu-copy"><strong>Acesso Empresas</strong><small>Portal dos clientes</small></span>
        </a>
        <a id="linkAdmin" class="menu-link" href="#">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span class="menu-copy"><strong>Acesso Restrito</strong><small>Administração SafeWork</small></span>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="titulo">
      <span class="eyebrow">Tecnologia para segurança do trabalho</span>
      <h1 id="titulo">SafeWork<br><span>Engenharia.</span></h1>
      <p class="subtitle">Gestão de EPIs</p>
      <div class="divider" aria-hidden="true"></div>
    </section>
  </main>
  <footer>© <span id="ano"></span> SafeWork Engenharia</footer>
  <div class="toast" id="toast" role="status" hidden>Este portal será disponibilizado quando o ambiente estiver configurado.</div>
  <script>
    'use strict';
    // Quando os portais existirem, informe aqui as URLs reais.
    // Exemplos planejados (AINDA NÃO PUBLICADOS):
    // empresas: 'https://app.safeworkengenharia.com.br'
    // restrito: 'https://admin.safeworkengenharia.com.br'
    //
    // Destinos escolhidos pelo ambiente em que a página está sendo exibida.
    // AMBIENTE LOCAL (localhost, 127.0.0.1 ou [::1]): cada portal abre na
    // origem do seu próprio namespace — Portal do Cliente em :5500 e Painel
    // Privado em :5501 — porque o backend mantém allowlists de CORS/Origin
    // disjuntas para os dois. Por isso "Acesso Restrito" funciona mesmo
    // quando esta página é vista pela porta 5500. O caminho até a pasta
    // frontend/ é o mesmo desta página (raiz do repositório ou raiz em
    // frontend/), então nada depende de onde o servidor estático foi aberto.
    // PRODUÇÃO (qualquer outro host): valem somente os destinos de
    // PORTAIS_PRODUCAO, a preencher com os domínios definitivos quando a
    // infraestrutura estiver configurada. Enquanto vazios, o aviso provisório
    // continua. Nenhuma URL local é usada fora do ambiente local.
    const PORTAIS_PRODUCAO = { empresas: '', restrito: '' };
    const HOSTS_LOCAIS = ['localhost', '127.0.0.1', '[::1]'];
    function portaisLocais() {
      const base = location.pathname.replace(/\/institucional\/[^/]*$/, '');
      return {
        empresas: 'http://localhost:5500' + base + '/portal/index.html',
        restrito: 'http://localhost:5501' + base + '/painel-privado/index.html',
      };
    }
    const PORTAIS = HOSTS_LOCAIS.indexOf(location.hostname) !== -1 ? portaisLocais() : PORTAIS_PRODUCAO;

    const botao = document.getElementById('menuButton');
    const painel = document.getElementById('menuPanel');
    const toast = document.getElementById('toast');
    let timer;
    function fechar() { painel.hidden = true; botao.setAttribute('aria-expanded', 'false'); botao.setAttribute('aria-label', 'Abrir menu de acessos'); }
    function alternar() { const abrir = painel.hidden; painel.hidden = !abrir; botao.setAttribute('aria-expanded', String(abrir)); botao.setAttribute('aria-label', abrir ? 'Fechar menu de acessos' : 'Abrir menu de acessos'); }
    function prepararLink(id, url) {
      const link = document.getElementById(id);
      if (url) { link.href = url; return; }
      link.addEventListener('click', function (event) {
        event.preventDefault(); fechar(); toast.hidden = false;
        clearTimeout(timer); timer = setTimeout(function () { toast.hidden = true; }, 3500);
      });
    }
    botao.addEventListener('click', alternar);
    document.addEventListener('click', function (event) { if (!painel.hidden && !event.target.closest('.nav')) fechar(); });
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape') { fechar(); botao.focus(); } });
    document.getElementById('ano').textContent = new Date().getFullYear();
    prepararLink('linkEmpresas', PORTAIS.empresas);
    prepararLink('linkAdmin', PORTAIS.restrito);
  </script>
</body>
</html>
