name: Deploy HML (CI verde, aprovação humana)

# O job publicar só pode começar depois do gate do environment homologacao.
# Disparo automático: somente após CI concluído com sucesso de um push na main (workflow_run);
# o commit é o head_sha desse CI e precisa ser a cabeça atual da main. O disparo manual continua
# disponível como contingência, com todos os controles originais.

run-name: ${{ github.event_name == 'workflow_run' && format('HML automatico {0}', github.event.workflow_run.head_sha) || format('HML manual {0}', inputs.commit) }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA completo (40 hex) de um commit da main com o CI verde"
        required: true
        type: string
      confirmacao:
        description: "Digite HOMOLOGACAO para confirmar"
        required: true
        type: string
      permitir_commit_anterior:
        description: "Somente rollback de código: aceita commit anterior à cabeça da main; a release sai rotulada como retroativa"
        required: false
        type: boolean
        default: false
      publicar:
        description: "Solicitar publicação após aprovação do environment homologacao"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Uma preparação por vez; a que está em andamento nunca é cancelada por outra.
concurrency:
  group: deploy-hml
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  validar:
    name: Validar commit, CI verde e posição na main
    # Filtro barato; a autoridade é validar-automatico.js. CI de PR, falho, cancelado ou de outra branch nem começa.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENTO: ${{ github.event_name }}
      COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit }}
    outputs:
      rotulo: ${{ steps.decisao.outputs.rotulo }}
      atual: ${{ steps.decisao.outputs.atual }}
      commit: ${{ steps.decisao.outputs.commit }}
    steps:
      - name: Confirmação literal (manual), formato do SHA e execução a partir da main
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          REF_DO_WORKFLOW: ${{ github.ref }}
        run: |
          # A validação vive neste YAML: só vale o da própria main.
          [ "$REF_DO_WORKFLOW" = "refs/heads/main" ] || { echo "o workflow só pode ser disparado a partir da main (ref: $REF_DO_WORKFLOW)"; exit 1; }
          printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "o commit precisa ser o SHA completo, 40 hex minúsculos"; exit 1; }
          case "$EVENTO" in
            workflow_dispatch) [ "$CONFIRMACAO" = "HOMOLOGACAO" ] || { echo "confirmação ausente ou diferente de HOMOLOGACAO"; exit 1; } ;;
            workflow_run) ;;
            *) echo "evento não previsto: $EVENTO"; exit 1 ;;
          esac

      - name: Checkout da main (história completa, sem credenciais persistidas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Autoteste dos scripts de homologação
        run: node --test ".github/scripts/hml/test/*.test.js"

      - name: Coletar fatos (cabeça da main, ancestralidade, execuções do CI)
        env:
          PERMITIR_ANTERIOR: ${{ inputs.permitir_commit_anterior }}
          GH_TOKEN: ${{ github.token }}
          CI_ID: ${{ github.event.workflow_run.id }}
          CI_NAME: ${{ github.event.workflow_run.name }}
          CI_PATH: ${{ github.event.workflow_run.path }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_STATUS: ${{ github.event.workflow_run.status }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          CABECA="$(git rev-parse HEAD)"
          if git cat-file -e "${COMMIT}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$COMMIT" HEAD; then ANCESTRAL=true; else ANCESTRAL=false; fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&per_page=50" \
            --jq '[.workflow_runs[] | {head_sha, path, event, head_branch, status, conclusion}]' > "$RUNNER_TEMP/execucoes-ci.json"
          node -e '
            const fs = require("node:fs");
            const fatos = {
              commit: process.env.COMMIT,
              cabecaMain: process.argv[1],
              ancestral: process.argv[2] === "true",
              permitirAnterior: process.env.PERMITIR_ANTERIOR === "true",
              execucoesCi: JSON.parse(fs.readFileSync(process.argv[3], "utf8")),
              agora: Date.now(),
            };
            fs.writeFileSync(process.argv[4], JSON.stringify(fatos, null, 2));
          ' "$CABECA" "$ANCESTRAL" "$RUNNER_TEMP/execucoes-ci.json" "$RUNNER_TEMP/fatos.json"
          if [ "$EVENTO" = "workflow_run" ]; then
            printf '%s' "$CI_ID" | grep -Eq '^[0-9]{1,20}$' || { echo "id da execução do CI inválido"; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_ID}" \
              --jq '{id, name, path, event, head_branch, head_sha, status, conclusion, head_repository: .head_repository.full_name}' > "$RUNNER_TEMP/ci-api.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-hml.yml/runs?per_page=100" \
              --jq '[.workflow_runs[] | {id, display_title, status, conclusion}]' > "$RUNNER_TEMP/execucoes-cd.json"
            node -e '
              const fs = require("node:fs");
              const e = process.env;
              const numero = (v) => (/^[0-9]{1,20}$/.test(v || "") ? Number(v) : null);
              const fatos = {
                repositorio: e.GITHUB_REPOSITORY,
                evento: { id: numero(e.CI_ID), name: e.CI_NAME, path: e.CI_PATH, event: e.CI_EVENT, head_branch: e.CI_BRANCH, head_sha: e.CI_SHA, status: e.CI_STATUS, conclusion: e.CI_CONCLUSION, head_repository: e.CI_REPO },
                api: JSON.parse(fs.readFileSync(process.argv[1], "utf8")),
                cabecaMain: process.argv[2],
                execucaoAtual: { id: numero(e.GITHUB_RUN_ID), tentativa: numero(e.GITHUB_RUN_ATTEMPT) },
                execucoesDeploy: JSON.parse(fs.readFileSync(process.argv[3], "utf8")),
              };
              fs.writeFileSync(process.argv[4], JSON.stringify(fatos, null, 2));
            ' "$RUNNER_TEMP/ci-api.json" "$CABECA" "$RUNNER_TEMP/execucoes-cd.json" "$RUNNER_TEMP/fatos-automaticos.json"
          fi

      - name: Validar o disparo automático (CI de push na main, payload e API coerentes, sem duplicidade)
        if: ${{ github.event_name == 'workflow_run' }}
        run: node .github/scripts/hml/validar-automatico.js --fatos "$RUNNER_TEMP/fatos-automaticos.json"

      - name: Decidir (fail-closed)
        id: decisao
        run: node .github/scripts/hml/validar-commit.js --fatos "$RUNNER_TEMP/fatos.json"

      - name: Resumo
        env:
          ROTULO: ${{ steps.decisao.outputs.rotulo }}
          ATUAL: ${{ steps.decisao.outputs.atual }}
          COMMIT: ${{ steps.decisao.outputs.commit }}
        run: |
          {
            echo "## Preparação de homologação"
            echo "- Commit: \`$COMMIT\`"
            echo "- Release: \`$ROTULO\`"
            echo "- Cabeça atual da main: $ATUAL"
            [ "$ATUAL" = "true" ] || echo "- **ATENÇÃO: release retroativa, não é a versão atual da main.**"
            echo "- A publicação depende dos interruptores e de aprovação no environment homologacao."
          } >> "$GITHUB_STEP_SUMMARY"

  empacotar:
    name: Gerar pacotes do Portal e do Painel com manifestos
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_sha256: ${{ steps.selo.outputs.release_sha256 }}
      artifact_id: ${{ steps.artefato.outputs.artifact-id }}
    steps:
      - name: Checkout exato do commit validado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validar.outputs.commit }}
          persist-credentials: false

      - name: Conferir que o checkout é exatamente o commit validado
        env:
          COMMIT: ${{ needs.validar.outputs.commit }}
        run: |
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "checkout diferente do commit validado"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "árvore de trabalho não está limpa"; exit 1; }

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Frontend - provas dos dois empacotadores
        working-directory: frontend
        run: node --test test/publicacao.test.js test/publicacao-painel.test.js

      - name: Gerar release (dois pacotes, manifestos e release.json)
        env:
          COMMIT: ${{ needs.validar.outputs.commit }}
          ROTULO: ${{ needs.validar.outputs.rotulo }}
          ATUAL: ${{ needs.validar.outputs.atual }}
        run: node .github/scripts/hml/gerar-release.js --saida "$RUNNER_TEMP/release" --commit "$COMMIT" --rotulo "$ROTULO" --atual "$ATUAL"

      - name: Conferir manifestos com sha256sum
        run: |
          cd "$RUNNER_TEMP/release/portal" && sha256sum -c --quiet ../manifesto-portal.sha256
          cd "$RUNNER_TEMP/release/painel" && sha256sum -c --quiet ../manifesto-painel.sha256
          cat "$RUNNER_TEMP/release/release.json"

      - name: Fixar hash da release antes da aprovação
        id: selo
        run: |
          HASH="$(sha256sum "$RUNNER_TEMP/release/release.json" | cut -d ' ' -f 1)"
          echo "release_sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "Release SHA-256: \`$HASH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar release como artefato da execução
        id: artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ needs.validar.outputs.rotulo }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Publicar frontend aprovado e aguardar verificações
    needs: [validar, empacotar]
    if: ${{ vars.HML_PUBLICACAO_HABILITADA == 'true' && github.repository == 'ramirespaes/Gestao_Epi_Fabricas' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publicar == true) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == needs.validar.outputs.commit)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homologacao
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout do controlador imutável desta execução
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Reconferir a cabeça da main depois da aprovação, antes de qualquer credencial
        env:
          GH_TOKEN: ${{ github.token }}
          HML_COMMIT: ${{ needs.validar.outputs.commit }}
          HML_EXIGIR_ATUAL: ${{ needs.validar.outputs.atual }}
        run: |
          HML_CABECA_ATUAL="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          export HML_CABECA_ATUAL
          node .github/scripts/hml/validar-automatico.js --atualidade

      - name: Baixar somente o artefato produzido nesta execução
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.empacotar.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-aprovada

      - name: Conferir identidade e integridade antes de obter credenciais
        env:
          HML_COMMIT: ${{ needs.validar.outputs.commit }}
          HML_ROTULO: ${{ needs.validar.outputs.rotulo }}
          HML_RELEASE_SHA256: ${{ needs.empacotar.outputs.release_sha256 }}
          HML_RELEASE_DIR: ${{ runner.temp }}/release-aprovada
          HML_ROLE: ${{ vars.HML_AWS_ROLE_ARN }}
          HML_CONTA: ${{ vars.HML_AWS_ACCOUNT_ID }}
          HML_REGIAO: ${{ vars.HML_AWS_REGION }}
          HML_BUCKET: ${{ vars.HML_RELEASE_BUCKET }}
        run: |
          node -e 'const p = require("./deploy/hml/cd/protocolo"); const e = process.env; p.validarDestino(e); p.conferirRelease({dir:e.HML_RELEASE_DIR, commit:e.HML_COMMIT, rotulo:e.HML_ROTULO, releaseSha256:e.HML_RELEASE_SHA256});'

      - name: Credenciais AWS temporárias por OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.HML_AWS_ROLE_ARN }}
          aws-region: ${{ vars.HML_AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: hml-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          mask-aws-account-id: true

      - name: Entregar pedido aprovado e exigir recibo do agente
        env:
          HML_PUBLICAR: ${{ inputs.publicar }}
          HML_HABILITADA: ${{ vars.HML_PUBLICACAO_HABILITADA }}
          HML_CONFIRMACAO: ${{ inputs.confirmacao }}
          HML_PERMITIR_ANTERIOR: ${{ inputs.permitir_commit_anterior }}
          HML_COMMIT: ${{ needs.validar.outputs.commit }}
          HML_ROTULO: ${{ needs.validar.outputs.rotulo }}
          HML_RELEASE_SHA256: ${{ needs.empacotar.outputs.release_sha256 }}
          HML_RELEASE_DIR: ${{ runner.temp }}/release-aprovada
          HML_BUCKET: ${{ vars.HML_RELEASE_BUCKET }}
          HML_CONTA: ${{ vars.HML_AWS_ACCOUNT_ID }}
          HML_REGIAO: ${{ vars.HML_AWS_REGION }}
        run: node deploy/hml/cd/publicar.js
